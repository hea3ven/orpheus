name: Pull-request quality gate

on:
  pull_request:

concurrency:
  group: pull-request-quality-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Pull-request quality gate
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      # This runs before every setup action so failures still leave an artifact
      # directory for the cancellation-safe upload below.
      - name: Initialize quality diagnostics
        id: diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/test-coverage
          printf 'QUALITY_TOOLS=%s/orpheus-quality-tools\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'Quality gate setup started.\n' > artifacts/test-coverage/setup.log

      - name: Check out synthetic pull-request merge
        id: checkout
        uses: actions/checkout@v5
        with:
          # github.sha is the pull_request event's tested merge commit, not the head SHA.
          ref: ${{ github.sha }}
          fetch-depth: 0
          # Preserve diagnostics that were initialized before this checkout.
          clean: false

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'

      - name: Restore pinned quality tools
        id: quality-tools
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/orpheus-quality-tools
          key: quality-tools-${{ runner.os }}-${{ runner.arch }}-bd-1.2.2-dolt-2.2.3-golangci-lint-2.12.2

      - name: Provision pinned quality tools
        id: provision-tools
        if: ${{ success() && !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          log='artifacts/test-coverage/setup.log'
          exec > >(tee -a "$log") 2>&1

          tools="$QUALITY_TOOLS"
          bin="$tools/bin"
          tools_ready() {
            [[ -x "$bin/bd" && -x "$bin/dolt" && -x "$bin/golangci-lint" ]] &&
              "$bin/bd" --version | grep --fixed-strings '1.2.2' &&
              "$bin/dolt" version | grep --fixed-strings '2.2.3' &&
              "$bin/golangci-lint" version | grep --fixed-strings '2.12.2'
          }

          if ! tools_ready; then
            rm -rf "$tools"
            mkdir -p "$bin"
            downloads="$(mktemp -d)"
            trap 'rm -rf "$downloads"' EXIT

            beads="$downloads/beads.tar.gz"
            curl --fail --location --retry 3 --silent --show-error \
              https://github.com/gastownhall/beads/releases/download/v1.2.2/beads_1.2.2_linux_amd64.tar.gz \
              --output "$beads"
            printf '%s  %s\n' \
              '8140098a51d3b81d5548d1c5e6db1a2d9930e5d141efe2a4bff7d079c4d321e8' "$beads" | sha256sum --check
            tar -xzf "$beads" -C "$bin" bd

            dolt="$downloads/dolt.tar.gz"
            curl --fail --location --retry 3 --silent --show-error \
              https://github.com/dolthub/dolt/releases/download/v2.2.3/dolt-linux-amd64.tar.gz \
              --output "$dolt"
            printf '%s  %s\n' \
              'ffafa7cc172cada5f77ca3fb96306545ddac44a111625f75f870306c7f197301' "$dolt" | sha256sum --check
            tar -xzf "$dolt" -C "$downloads"
            install -m 0755 "$downloads/dolt-linux-amd64/bin/dolt" "$bin/dolt"

            golangci_lint="$downloads/golangci-lint.tar.gz"
            curl --fail --location --retry 3 --silent --show-error \
              https://github.com/golangci/golangci-lint/releases/download/v2.12.2/golangci-lint-2.12.2-linux-amd64.tar.gz \
              --output "$golangci_lint"
            printf '%s  %s\n' \
              '8df580d2670fed8fa984aac0507099af8df275e665215f5c7a2ae3943893a553' "$golangci_lint" | sha256sum --check
            tar -xzf "$golangci_lint" -C "$downloads"
            install -m 0755 "$downloads/golangci-lint-2.12.2-linux-amd64/golangci-lint" "$bin/golangci-lint"
          fi

          tools_ready
          echo "$bin" >> "$GITHUB_PATH"

      # Action logs are owned by GitHub, but their outcomes and all shell setup
      # output are retained locally so failed setup paths remain diagnosable.
      - name: Record setup status
        if: ${{ !cancelled() && (success() || failure()) }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/test-coverage
          log='artifacts/test-coverage/setup.log'
          {
            printf 'checkout outcome: %s\n' '${{ steps.checkout.outcome }}'
            printf 'Go setup outcome: %s\n' '${{ steps.setup-go.outcome }}'
            printf 'tool cache outcome: %s\n' '${{ steps.quality-tools.outcome }}'
            printf 'tool provisioning outcome: %s\n' '${{ steps.provision-tools.outcome }}'
          } >> "$log"

      - name: Run single-pass quality report against base
        id: quality-report
        if: ${{ success() && !cancelled() }}
        continue-on-error: true
        shell: bash
        env:
          BASELINE: ${{ runner.temp }}/base-test-coverage-baseline.json
        run: |
          set -uo pipefail
          set +e
          report='artifacts/test-coverage/report.json'
          log='artifacts/test-coverage/quality.log'
          base_error='artifacts/test-coverage/base-baseline-error.log'
          mkdir -p artifacts/test-coverage
          quality_exit=0

          if ! git show "$BASE_SHA:coverage/test-coverage-baseline.json" >"$BASELINE" 2>"$base_error"; then
            cat "$base_error" | tee -a "$log"
            quality_exit=1
          else
            cp "$BASELINE" artifacts/test-coverage/base-test-coverage-baseline.json
            make quality QUALITY_COMPARE_TO="$BASELINE" 2>&1 | tee "$log"
            statuses=("${PIPESTATUS[@]}")
            quality_exit="${statuses[0]}"
            if [[ "${statuses[1]}" -ne 0 ]]; then
              quality_exit=1
            fi
          fi

          decision=execution_failure
          if [[ -f "$report" ]]; then
            decision="$(jq --raw-output '.decision.status // "execution_failure"' "$report" 2>>"$log")" || decision=execution_failure
          fi
          case "$decision" in
            pass|refresh_required|coverage_regression|timing_budget_exceeded|test_failed) ;;
            *) decision=execution_failure; quality_exit=1 ;;
          esac
          if [[ "$quality_exit" -eq 0 && "$decision" != pass ]]; then
            quality_exit=1
          fi
          printf 'decision=%s\nexit_code=%s\n' "$decision" "$quality_exit" >> "$GITHUB_OUTPUT"
          exit "$quality_exit"

      - name: Lint without rerunning tests
        id: lint
        if: ${{ success() && !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          set +e
          mkdir -p artifacts/test-coverage
          make lint 2>&1 | tee artifacts/test-coverage/lint.log
          statuses=("${PIPESTATUS[@]}")
          if [[ "${statuses[1]}" -ne 0 ]]; then
            exit 1
          fi
          exit "${statuses[0]}"

      - name: Build without rerunning tests
        id: build
        if: ${{ success() && !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          set +e
          mkdir -p artifacts/test-coverage
          make build 2>&1 | tee artifacts/test-coverage/build.log
          statuses=("${PIPESTATUS[@]}")
          if [[ "${statuses[1]}" -ne 0 ]]; then
            exit 1
          fi
          exit "${statuses[0]}"

      - name: Enforce quality gate
        if: ${{ !cancelled() && (success() || failure()) }}
        shell: bash
        env:
          QUALITY_DECISION: ${{ steps.quality-report.outputs.decision }}
          QUALITY_EXIT_CODE: ${{ steps.quality-report.outputs.exit_code }}
          QUALITY_OUTCOME: ${{ steps.quality-report.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          set -euo pipefail
          failed=0

          case "$QUALITY_DECISION" in
            pass)
              if [[ "$QUALITY_OUTCOME" == success ]]; then
                quality_result='**Pass**'
              else
                quality_result='**Execution failed**'
                failed=1
              fi
              ;;
            refresh_required)
              quality_result='**Failed:** Baseline refresh required'
              failed=1
              ;;
            coverage_regression)
              quality_result='**Failed:** Coverage regression'
              failed=1
              ;;
            timing_budget_exceeded)
              quality_result='**Failed:** Timing budget exceeded'
              failed=1
              ;;
            test_failed)
              quality_result='**Failed:** Tests failed'
              failed=1
              ;;
            *)
              quality_result='**Execution failed**'
              failed=1
              ;;
          esac

          case "$LINT_OUTCOME" in
            success) lint_result='**Pass**' ;;
            failure) lint_result='**Failed**'; failed=1 ;;
            *) lint_result='**Not run**'; failed=1 ;;
          esac
          case "$BUILD_OUTCOME" in
            success) build_result='**Pass**' ;;
            failure) build_result='**Failed**'; failed=1 ;;
            *) build_result='**Not run**'; failed=1 ;;
          esac

          if [[ "$failed" -eq 0 ]]; then
            gate_alert='TIP'
            gate_result='Gate passed'
          else
            gate_alert='CAUTION'
            gate_result='Gate failed'
          fi

          append_log() {
            local title="$1"
            local path="$2"
            [[ -s "$path" ]] || return 0
            printf '\n<details>\n<summary>%s</summary>\n\n' "$title"
            printf '%s\n' '```text'
            cat "$path"
            printf '%s\n' '```' '</details>'
          }

          {
            echo '# Pull-request quality gate'
            echo
            echo "> [!$gate_alert]"
            echo "> **$gate_result.** See the check results and test details below."
            echo
            echo '| Check | Result |'
            echo '| --- | --- |'
            echo "| Test quality | $quality_result |"
            echo "| Lint | $lint_result |"
            echo "| Build | $build_result |"
            echo
            echo "Quality command exit code: \`${QUALITY_EXIT_CODE:-unavailable}\`"

            if [[ -f artifacts/test-coverage/report.md ]]; then
              echo
              cat artifacts/test-coverage/report.md
            else
              echo
              echo '## Test quality'
              echo
              echo '> [!CAUTION]'
              echo '> **Quality report unavailable.** Inspect the setup and command diagnostics below.'
            fi

            if [[ "$QUALITY_OUTCOME" != success ]]; then
              append_log 'Quality command output' artifacts/test-coverage/quality.log
            fi
            if [[ ! -f artifacts/test-coverage/report.md ]]; then
              append_log 'Setup diagnostics' artifacts/test-coverage/setup.log
            fi
            if [[ "$LINT_OUTCOME" != success ]]; then
              append_log 'Lint output' artifacts/test-coverage/lint.log
            fi
            if [[ "$BUILD_OUTCOME" != success ]]; then
              append_log 'Build output' artifacts/test-coverage/build.log
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$failed" -ne 0 ]]; then
            echo "::error::Pull-request quality gate failed: ${QUALITY_DECISION:-execution_failure}"
            exit 1
          fi

      # This is the only cancellation-safe follow-up: partial diagnostics are
      # useful even when a newer pull-request SHA has superseded this run.
      - name: Upload quality report and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pull-request-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-coverage/
          if-no-files-found: warn
          retention-days: 7
