# TEMPORARY DIAGNOSTIC ONLY. Do not merge. Opening this PR consumes job 1;
# manually rerun this exact run twice for jobs 2 and 3. No synchronize trigger.
name: Experimental timing investigation - DO NOT MERGE

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  actions: read

jobs:
  diagnostic:
    if: github.head_ref == 'orpheus/op-dys'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact experimental head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up fixed Go without restored caches
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: false

      - name: Provision fixed tools and modules before offline measurements
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[123]$ ]]
          bin="$RUNNER_TEMP/timing-tools/bin"
          mkdir -p "$bin"
          downloads="$(mktemp -d)"
          trap 'rm -rf "$downloads"' EXIT
          beads="$downloads/beads.tar.gz"
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/gastownhall/beads/releases/download/v1.2.2/beads_1.2.2_linux_amd64.tar.gz \
            --output "$beads"
          printf '%s  %s\n' \
            '8140098a51d3b81d5548d1c5e6db1a2d9930e5d141efe2a4bff7d079c4d321e8' "$beads" | sha256sum --check
          tar -xzf "$beads" -C "$bin" bd

          dolt="$downloads/dolt.tar.gz"
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/dolthub/dolt/releases/download/v2.2.3/dolt-linux-amd64.tar.gz \
            --output "$dolt"
          printf '%s  %s\n' \
            'ffafa7cc172cada5f77ca3fb96306545ddac44a111625f75f870306c7f197301' "$dolt" | sha256sum --check
          tar -xzf "$dolt" -C "$downloads"
          install -m 0755 "$downloads/dolt-linux-amd64/bin/dolt" "$bin/dolt"
          echo "$bin" >> "$GITHUB_PATH"
          go mod download

      - name: Retrieve exact attempt-one artifact as experimental authority
        if: github.run_attempt != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive='experiments/timing-gate/published-input'
          mkdir -p "$archive"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/1" > "$archive/producer.json"
          jq -e --arg sha '${{ github.event.pull_request.head.sha }}' \
            '.head_sha == $sha and .run_attempt == 1 and .conclusion == "success" and .event == "pull_request"' \
            "$archive/producer.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" > "$archive/artifacts.json"
          name="timing-$GITHUB_RUN_ID-1"
          jq --arg name "$name" '[.artifacts[] | select(.name == $name and .expired == false)] | if length == 1 then .[0] else error("missing or ambiguous artifact") end' \
            "$archive/artifacts.json" > "$archive/artifact.json"
          id="$(jq -r .id "$archive/artifact.json")"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$archive/baseline.zip"
          digest="$(jq -r .digest "$archive/artifact.json")"
          [[ "$digest" == sha256:* ]]
          printf '%s  %s\n' "${digest#sha256:}" "$archive/baseline.zip" | sha256sum --check

      - name: Collect two warm-ups and five strictly alternating pairs
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/timing-gate/collect.py experiments/timing-gate/hosted-output "$GITHUB_RUN_ATTEMPT"

      - name: Retain complete or partial diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timing-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            experiments/timing-gate/hosted-output/
            experiments/timing-gate/published-input/
          if-no-files-found: warn
          retention-days: 30
