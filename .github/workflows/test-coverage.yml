name: Test coverage

on:
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'coverage/**'
      - 'cmd/testcoverage/**'
      - 'Makefile'

permissions:
  contents: read

jobs:
  coverage:
    name: Classified lane coverage
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.base_ref || inputs.base_ref || 'main' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/steveyegge/beads/cmd/bd@v1.2.1
          curl -fsSL https://github.com/dolthub/dolt/releases/download/v2.2.3/install.sh | sudo bash
          dolt version
      - name: Compare classified coverage with base
        shell: bash
        run: |
          set -euo pipefail
          base_baseline="$RUNNER_TEMP/main-test-coverage-baseline.json"
          git show "origin/$BASE_REF:coverage/test-coverage-baseline.json" >"$base_baseline"
          go run ./cmd/testcoverage -compare-to "$base_baseline" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload short-lived coverage report
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-report
          path: artifacts/test-coverage/report.json
          retention-days: 7
