version: "2"

run:
  # The quality collector adds policy exclusions to a temporary configuration.
  relative-path-mode: gomod
  # testpackage needs test files to be analyzed so package-level tests stay in
  # external <package>_test packages unless intentionally exempted below.
  tests: true

linters:
  enable:
    - depguard
    - dupl
    - errorlint
    - forbidigo
    - funlen
    - gocognit
    - gocritic
    - misspell
    - nestif
    - nilerr
    - nolintlint
    - predeclared
    - revive
    - testpackage
    - testifylint
    - thelper
    - unconvert

  settings:
    depguard:
      rules:
        agentexec:
          files:
            - '${base-path}/internal/agentexec/*.go'
          # Use exact matches ($) and slash prefixes to allow similarly named
          # packages while blocking these packages and their descendants.
          deny:
            - pkg: 'github.com/hea3ven/orpheus/internal/agent$'
              desc: keep agent execution independent of agent orchestration
            - pkg: 'github.com/hea3ven/orpheus/internal/agent/'
              desc: keep agent execution independent of agent orchestration
            - pkg: 'github.com/hea3ven/orpheus/internal/cli$'
              desc: keep agent execution independent of the CLI
            - pkg: 'github.com/hea3ven/orpheus/internal/cli/'
              desc: keep agent execution independent of the CLI
            - pkg: 'github.com/hea3ven/orpheus/internal/workflow$'
              desc: keep agent execution independent of workflow orchestration
            - pkg: 'github.com/hea3ven/orpheus/internal/workflow/'
              desc: keep agent execution independent of workflow orchestration
        task:
          files:
            - '${base-path}/internal/task/*.go'
            - '${base-path}/internal/task/**/*.go'
          deny:
            - pkg: 'github.com/hea3ven/orpheus/internal/registry$'
              desc: keep task logic independent of the repository registry
    forbidigo:
      # testing.TB.TempDir can retain a platform-specific symlink such as
      # macOS /tmp -> /private/tmp. Tests must use the canonical shared helper.
      forbid:
        - pattern: 't[b]?\.TempDir'
          msg: use testutil.CanonicalTempDir(t) so test path identity is canonical
    gocritic:
      enabled-checks:
        - ruleguard
      settings:
        ruleguard:
          # make lint writes its derived config outside the checkout.
          rules: '${base-path}/lint/collaborators.go'
          failOn: all
    funlen:
      # Keep production functions compact. Test files are excluded below, so
      # long fixtures do not need local //nolint:funlen directives.
      lines: 60
      statements: 40
      ignore-comments: true
    revive:
      # Use an explicit low-noise rule list instead of revive defaults. The
      # defaults currently include broad documentation and unused-parameter
      # style checks that are outside the MVP lint baseline.
      rules:
        - name: atomic
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: duplicated-imports
        - name: early-return
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: identical-branches
        - name: if-return
        - name: increment-decrement
        - name: modifies-parameter
        - name: modifies-value-receiver
        - name: range
        - name: string-of-int
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unconditional-recursion
        - name: unreachable-code
    testpackage:
      # Match the M1 testing convention: package-level behavior should use
      # external test packages, while focused private-helper tests may opt in to
      # same-package access by using *_internal_test.go. export_test.go remains
      # available for the standard Go test-only export pattern.
      skip-regexp: '(export|internal)_test\.go'
      allow-packages:
        - main
    testifylint:
      # require-error mostly enforces assert-vs-require style and creates broad
      # test churn. Keep the correctness-oriented testify checks enabled.
      disable:
        - require-error

  exclusions:
    rules:
      # Test fixtures are not subject to production import or length limits.
      - path: '.*_test\.go$'
        linters:
          - depguard
          - funlen
